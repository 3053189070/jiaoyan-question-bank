<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研题 · 教研题库系统</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Microsoft YaHei",Arial;color:#172033;background:#f4f6fb}button,input,select,textarea{font:inherit}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:240px;background:#12213f;color:#fff;padding:24px}.brand{display:flex;gap:12px;align-items:center;font-size:22px;font-weight:800;margin-bottom:38px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#ff842f}.nav{padding:12px 14px;margin:8px 0;border-radius:12px;color:#cbd8f1}.nav.active{background:#ffffff18;color:#fff}.main{margin-left:240px}.top{height:82px;background:white;border-bottom:1px solid #e3e8f2;display:flex;align-items:center;justify-content:space-between;padding:0 32px}.top h1{font-size:23px;margin:0}.sub{font-size:13px;color:#7a8599}.content{padding:28px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:20px}.stat b{font-size:28px}.muted{color:#7a8599}.bar{display:flex;gap:10px;align-items:center;border-bottom:1px solid #e5e9f1;padding:15px}.search{flex:1}.input,select,textarea{width:100%;border:1px solid #d7deea;border-radius:10px;padding:10px 12px;background:white}.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:650;background:#3157d5;color:#fff}.btn.orange{background:#f87822}.btn.light{background:#eef2ff;color:#3157d5}.btn.danger{background:#fff0f0;color:#c52e2e}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th{background:#f8fafc;color:#687386;font-weight:600}th,td{text-align:left;padding:14px;border-bottom:1px solid #edf0f5;vertical-align:top}.tag{display:inline-block;padding:2px 8px;border-radius:20px;background:#eef2ff;color:#3157d5;font-size:12px}.modal{position:fixed;inset:0;background:#17203399;display:none;place-items:center;padding:20px;z-index:10}.modal.open{display:grid}.box{background:#fff;border-radius:18px;padding:24px;width:min(700px,100%);max-height:90vh;overflow:auto}.box h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:13px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.drop{border:2px dashed #b9c7ee;border-radius:16px;padding:45px;text-align:center;background:#f7f9ff;cursor:pointer}.parsed{border:1px solid #dce3ef;border-radius:12px;padding:12px;margin:10px 0}.versions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.version{border:2px solid #e2e8f5;border-radius:14px;padding:20px;cursor:pointer}.version:hover{border-color:#3157d5}.empty{text-align:center;padding:55px;color:#8290a5}@media(max-width:850px){.side{display:none}.main{margin:0}.content{padding:14px}.top{padding:0 16px}.stats{grid-template-columns:1fr}.bar{flex-wrap:wrap}.search{flex-basis:100%}.grid,.versions{grid-template-columns:1fr}}</style></head>
<body><div class="app"><aside class="side"><div class="brand"><span class="logo">📚</span><span>研题<small style="display:block;font-size:11px;color:#b9c8e8">教研题库系统</small></span></div><div class="nav">▦ 工作台</div><div class="nav active">▤ 题库管理</div><div class="nav">▧ 试卷中心</div><div class="nav">✦ 智能导题</div></aside><main class="main"><header class="top"><div><h1>题库管理</h1><div class="sub">集中管理、整理与组卷</div></div><div><button class="btn light" onclick="openModal('pdfModal')">上传 PDF</button> <button class="btn orange" onclick="openModal('addModal')">＋ 添加题目</button></div></header><section class="content"><div class="stats"><div class="card stat"><span class="muted">题目总数</span><br><b id="total">0</b> 题</div><div class="card stat"><span class="muted">本次已选</span><br><b id="picked">0</b> 题</div><div class="card stat"><span class="muted">覆盖学科</span><br><b id="subjects">0</b> 个</div></div><div class="card" style="padding:0"><div class="bar"><input id="search" class="input search" placeholder="搜索题干、答案或来源…"><select id="filter"><option>全部难度</option><option>基础</option><option>中等</option><option>困难</option></select><button class="btn danger" onclick="removePicked()">删除</button><button class="btn" onclick="showExport()">导出试卷</button></div><div class="table"><table><thead><tr><th><input id="all" type="checkbox"></th><th>题目内容</th><th>题型</th><th>难度</th><th>年级</th><th>来源</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">题库暂无内容，请添加题目或上传 PDF</div></div></div></section></main></div>
<div id="addModal" class="modal"><div class="box"><h2>添加题目</h2><div class="field"><label>题目内容 *</label><textarea id="content" rows="4"></textarea></div><div class="grid"><div class="field"><label>学科</label><select id="subject"><option>数学</option><option>语文</option><option>英语</option><option>物理</option><option>化学</option></select></div><div class="field"><label>年级</label><select id="grade"><option>七年级</option><option>八年级</option><option selected>九年级</option><option>高一</option><option>高二</option><option>高三</option></select></div><div class="field"><label>题型</label><select id="type"><option>选择题</option><option>填空题</option><option>判断题</option><option selected>解答题</option></select></div><div class="field"><label>难度</label><select id="level"><option>基础</option><option selected>中等</option><option>困难</option></select></div></div><div class="field"><label>参考答案</label><textarea id="answer" rows="2"></textarea></div><div class="field"><label>题目解析</label><textarea id="analysis" rows="3"></textarea></div><div class="actions"><button class="btn light" onclick="closeModal('addModal')">取消</button><button class="btn" onclick="addQuestion()">保存入库</button></div></div></div>
<div id="pdfModal" class="modal"><div class="box"><h2>PDF 智能导题</h2><div class="drop" onclick="document.getElementById('pdf').click()"><input id="pdf" type="file" accept="application/pdf" hidden><b>点击选择 PDF 文件</b><div class="muted">提取文字并按题号拆分，入库前可校对</div></div><div id="pdfResult"></div><div class="actions"><button class="btn light" onclick="closeModal('pdfModal')">取消</button><button id="importBtn" class="btn" onclick="importParsed()" disabled>确认入库</button></div></div></div>
<div id="exportModal" class="modal"><div class="box"><h2>选择导出版本</h2><p class="muted">导出后可直接打印或另存为 PDF。</p><div class="versions"><div class="version" onclick="exportPaper('teacher')"><b>👩‍🏫 教师版</b><p class="muted">包含参考答案与详细解析</p></div><div class="version" onclick="exportPaper('student')"><b>📄 学生版</b><p class="muted">隐藏答案并保留答题空间</p></div></div><div class="actions"><button class="btn light" onclick="closeModal('exportModal')">取消</button></div></div></div>
<script type="module">import * as pdfjs from './pdf.mjs';pdfjs.GlobalWorkerOptions.workerSrc='./pdf.worker.min.mjs';window.pdfjs=pdfjs;</script><script>
const seed=[{id:1,content:'如图，在 △ABC 中，AB = AC，∠A = 40°，求 ∠B 的度数。',answer:'70°',analysis:'等腰三角形两底角相等，∠B=(180°−40°)÷2=70°。',subject:'数学',grade:'九年级',type:'解答题',difficulty:'基础',source:'示例题库'},{id:2,content:'已知函数 y = 2x + 1，当 x = 3 时，求 y 的值。',answer:'7',analysis:'将 x=3 代入，y=2×3+1=7。',subject:'数学',grade:'九年级',type:'填空题',difficulty:'基础',source:'示例题库'}];let items=JSON.parse(localStorage.getItem('yanti_questions')||'null')||seed,picked=[],parsed=[];const $=id=>document.getElementById(id);function save(){localStorage.setItem('yanti_questions',JSON.stringify(items))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('search').value.toLowerCase(),d=$('filter').value,arr=items.filter(x=>(x.content+x.answer+x.source).toLowerCase().includes(q)&&(d==='全部难度'||x.difficulty===d));$('rows').innerHTML=arr.map(x=>`<tr><td><input type="checkbox" ${picked.includes(x.id)?'checked':''} onchange="toggle(${x.id})"></td><td><b>${esc(x.content)}</b><div class="muted">${x.subject} · ${x.answer?'答案：'+esc(x.answer):'暂无答案'}</div></td><td><span class="tag">${x.type}</span></td><td>${x.difficulty}</td><td>${x.grade}</td><td>${esc(x.source)}</td></tr>`).join('');$('empty').style.display=arr.length?'none':'block';$('total').textContent=items.length;$('picked').textContent=picked.length;$('subjects').textContent=new Set(items.map(x=>x.subject)).size}window.toggle=id=>{picked=picked.includes(id)?picked.filter(x=>x!==id):[...picked,id];render()};$('search').oninput=render;$('filter').onchange=render;$('all').onchange=e=>{picked=e.target.checked?items.map(x=>x.id):[];render()};window.openModal=id=>$(id).classList.add('open');window.closeModal=id=>$(id).classList.remove('open');window.addQuestion=()=>{let c=$('content').value.trim();if(!c)return alert('请填写题目内容');items.unshift({id:Date.now(),content:c,answer:$('answer').value,analysis:$('analysis').value,subject:$('subject').value,grade:$('grade').value,type:$('type').value,difficulty:$('level').value,source:'手动录入'});save();render();closeModal('addModal');['content','answer','analysis'].forEach(x=>$(x).value='')};window.removePicked=()=>{if(!picked.length)return alert('请先选择题目');if(confirm('确定删除所选题目吗？')){items=items.filter(x=>!picked.includes(x.id));picked=[];save();render()}};window.showExport=()=>{if(!picked.length)return alert('请先选择题目');openModal('exportModal')};$('pdf').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{$('pdfResult').innerHTML='<p>正在识别，请稍候…</p>';let pdf=await window.pdfjs.getDocument({data:await f.arrayBuffer()}).promise,pages=[];for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),t=await p.getTextContent();pages.push(t.items.map(x=>x.str||'').join(' '))}let raw=pages.join(' ').replace(/\s+/g,' ').trim();if(!raw)throw Error('没有检测到文字，扫描版 PDF 需要先进行 OCR。');let cs=raw.split(/(?=(?:^|\s)\d{1,3}[.、．)）]\s*)/).map(x=>x.trim()).filter(x=>x.length>8);parsed=(cs.length>1?cs:[raw]).slice(0,80);$('pdfResult').innerHTML=parsed.map((x,i)=>`<div class="parsed"><b>第 ${i+1} 题</b><textarea rows="3" data-i="${i}">${esc(x)}</textarea></div>`).join('');$('importBtn').disabled=false}catch(err){$('pdfResult').innerHTML='<p style="color:#c22">'+esc(err.message)+'</p>'}};window.importParsed=()=>{document.querySelectorAll('[data-i]').forEach(x=>parsed[+x.dataset.i]=x.value);items=[...parsed.filter(Boolean).map((content,i)=>({id:Date.now()+i,content,answer:'',analysis:'',subject:'数学',grade:'九年级',type:'解答题',difficulty:'中等',source:$('pdf').files[0]?.name||'PDF 导入'})),...items];save();parsed=[];render();closeModal('pdfModal')};window.exportPaper=mode=>{let qs=items.filter(x=>picked.includes(x.id)),html=`<html><head><meta charset="utf-8"><title>${mode==='teacher'?'教师版':'学生版'}试卷</title><style>@page{size:A4;margin:20mm}body{font-family:'Microsoft YaHei';line-height:1.8;color:#172033}h1{text-align:center}.q{margin:22px 0;break-inside:avoid}.a{background:#f1f5ff;border-left:3px solid #3157d5;padding:10px;margin-top:8px}</style></head><body><h1>阶段练习</h1><p style="text-align:center">${mode==='teacher'?'教师版 · 含答案解析':'学生版 · 姓名：________ 班级：________'}</p>${qs.map((q,i)=>`<div class="q"><b>${i+1}.</b> ${esc(q.content)}${mode==='teacher'?`<div class="a"><b>答案：</b>${esc(q.answer||'暂无')}<br><b>解析：</b>${esc(q.analysis||'暂无')}</div>`:'<div style="height:80px;border-bottom:1px dashed #bbb"></div>'}</div>`).join('')}<script>onload=()=>print()<\/script></body></html>`;let u=URL.createObjectURL(new Blob([html],{type:'text/html'}));open(u,'_blank');closeModal('exportModal')};render();
</script></body></html>
